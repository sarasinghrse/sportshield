<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #0a1210;
      color: #d4e8d4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .header {
      background: linear-gradient(135deg, #0d1a10 0%, #122a14 100%);
      border-bottom: 1px solid rgba(26,92,26,0.4);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: #1a5c1a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text {
      font-weight: 900;
      font-size: 15px;
      color: #4ade80;
      letter-spacing: 0.05em;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74,222,128,0.5);
    }

    .section {
      padding: 14px 18px 0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(13,26,16,0.6);
      border: 1px solid rgba(26,92,26,0.25);
      border-radius: 8px;
      color: #d4e8d4;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 6px;
      text-align: left;
    }
    .action-btn:hover {
      background: rgba(26,92,26,0.25);
      border-color: rgba(26,92,26,0.5);
    }
    .action-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .action-desc {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      font-weight: 400;
    }

    .btn-red    .action-icon { background: rgba(220,38,38,0.2); }
    .btn-blue   .action-icon { background: rgba(59,130,246,0.2); }
    .btn-green  .action-icon { background: rgba(26,92,26,0.4); }

    .coming-soon-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(13,26,16,0.3);
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: 8px;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      font-weight: 600;
      cursor: default;
      margin-bottom: 6px;
      text-align: left;
    }
    .coming-soon-btn .action-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.05);
    }
    .coming-soon-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #f59e0b;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 6px;
    }

    .report-success {
      display: none;
      padding: 14px 18px;
      text-align: center;
    }
    .report-success.visible { display: block; }
    .report-success .check {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(74,222,128,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 24px;
    }
    .report-success h3 {
      color: #4ade80;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .report-success p {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }

    .footer {
      padding: 12px 18px;
      margin-top: 8px;
      border-top: 1px solid rgba(26,92,26,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer a {
      color: #3caa3c;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .footer a:hover { color: #4ade80; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="logo-text">SPORTSHIELD</span>
    </div>
    <div class="status-dot" title="Active"></div>
  </div>

  <!-- Main content -->
  <div id="main-view">
    <div class="section">
      <div class="section-title">Quick Actions</div>

      <button class="action-btn btn-red" id="btn-flag">
        <div class="action-icon">🚩</div>
        <div>
          <div>Flag as Pirate Site</div>
          <div class="action-desc">Report this page as a pirate content source</div>
        </div>
      </button>

      <button class="action-btn btn-blue" id="btn-warroom">
        <div class="action-icon">📡</div>
        <div>
          <div>Open War Room</div>
          <div class="action-desc">Live radar &amp; piracy enforcement</div>
        </div>
      </button>

      <button class="action-btn btn-green" id="btn-dashboard">
        <div class="action-icon">📊</div>
        <div>
          <div>Open Dashboard</div>
          <div class="action-desc">Login &amp; manage your protected assets</div>
        </div>
      </button>
    </div>

    <div class="section" style="padding-bottom: 4px;">
      <div class="section-title">Coming Soon</div>

      <div class="coming-soon-btn">
        <div class="action-icon">🔍</div>
        <div>
          <div>Scan Images on This Site <span class="coming-soon-tag">Soon</span></div>
          <div class="action-desc" style="color:rgba(255,255,255,0.22);">Check all images against your protected library</div>
        </div>
      </div>

      <div class="coming-soon-btn">
        <div class="action-icon">🏆</div>
        <div>
          <div>Leaderboard <span class="coming-soon-tag">Soon</span></div>
          <div class="action-desc" style="color:rgba(255,255,255,0.22);">Top pirate hunters — find contacts &amp; send DMCA notices</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Flag success message (shown after reporting) -->
  <div class="report-success" id="flag-success">
    <div class="check">✅</div>
    <h3>Page Flagged!</h3>
    <p id="flag-url"></p>
    <p style="margin-top: 6px;">This site has been reported as a pirate source.</p>
  </div>

  <div class="footer">
    <a id="footer-link">Open SportShield</a>
    <span style="font-size: 11px; color: rgba(255,255,255,0.2);">v1.1.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
