# Firebase App Hosting config for the Next.js frontend.
# App Hosting builds this app and serves SSR on Cloud Run behind Firebase Hosting.
# When you create the App Hosting backend in the console, set the app root to
# "frontend" so this file is picked up.
#
# Fill the values below from frontend/.env.local (these NEXT_PUBLIC_* values are
# public client config, not secrets). Point NEXT_PUBLIC_API_URL at your Cloud
# Run backend URL.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_API_URL
    value: https://sportshield-api-117814433634.us-central1.run.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBAk2Bl3VZ6ghArtzXLu6ciU08Vn1dSNE0
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sportshield-app.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sportshield-app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: sportshield-app.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "117814433634"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:117814433634:web:0f402952389ee6f55f3e3b
    availability: [BUILD, RUNTIME]
